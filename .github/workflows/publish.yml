name: Publish ready drafts to WordPress

on:
  schedule:
    - cron: "23 1 * * *"   # 08:23 Asia/Saigon every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build images only, publish nothing (1 = yes)"
        default: "1"
        required: false
      only_slug:
        description: "Optional: publish just this draft now, ignoring its date"
        default: ""
        required: false
      check_login:
        description: "Only test the WordPress login (1 = yes)"
        default: "0"
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Publish
        env:
          WP_USER: admin
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SITE_URL: https://kindredspacefinds.com
          MAX_POSTS: "1"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONLY_SLUG: ${{ github.event.inputs.only_slug }}
          CHECK_LOGIN: ${{ github.event.inputs.check_login || '0' }}
        run: python scripts/publish.py

      - name: Keep preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-images
          path: out/
          if-no-files-found: ignore

      - name: Save published list
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "ksf-publisher"
            git config user.email "actions@users.noreply.github.com"
            git add state/published.json
            git commit -m "Record published posts"
            git pull --rebase origin main
            git push
          fi
